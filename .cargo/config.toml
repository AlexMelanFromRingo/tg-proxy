# Cross-compilation linker configuration for CI
# These are only used when cross-compiling; native builds use the default linker.

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-musl]
# musl-gcc is provided by musl-tools on Ubuntu
linker = "musl-gcc"
