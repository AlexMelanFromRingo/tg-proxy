name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — fully static musl binary (runs on any Linux)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: tg-proxy-linux-x86_64
            cross: false

          # Linux aarch64 — static musl (Raspberry Pi, ARM servers)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: tg-proxy-linux-aarch64
            cross: true

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tg-proxy-windows-x86_64.exe
            cross: false

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: tg-proxy-macos-x86_64
            cross: false

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tg-proxy-macos-aarch64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install musl tools (Linux native)
        if: matrix.target == 'x86_64-unknown-linux-musl' && matrix.cross == false
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools

      - name: Build (native)
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/tg-proxy ${{ matrix.artifact }}

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target\${{ matrix.target }}\release\tg-proxy.exe" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "tg-proxy ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ## tg-proxy ${{ github.event.inputs.tag || github.ref_name }}

            High-performance Telegram WebSocket bridge proxy written in Rust.

            ### Binaries

            | Platform | File |
            |---|---|
            | Linux x86_64 (static) | `tg-proxy-linux-x86_64` |
            | Linux aarch64 (static) | `tg-proxy-linux-aarch64` |
            | Windows x86_64 | `tg-proxy-windows-x86_64.exe` |
            | macOS Intel | `tg-proxy-macos-x86_64` |
            | macOS Apple Silicon | `tg-proxy-macos-aarch64` |

            ### Quick start

            ```
            # Linux/macOS
            chmod +x tg-proxy-linux-x86_64
            ./tg-proxy-linux-x86_64

            # Windows
            tg-proxy-windows-x86_64.exe
            ```

            Then configure Telegram Desktop: **Settings → Advanced → Connection type → Proxy → SOCKS5 → 127.0.0.1:1080**

            Or open in Telegram automatically: `tg://socks?server=127.0.0.1&port=1080`

            **Mobile (LAN):** run with `--host 0.0.0.0` and connect from your phone to your LAN IP.
          files: dist/tg-proxy-*
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
