name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    name: ${{ matrix.artifact }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — fully static musl binary (runs on any Linux)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: tg-proxy-linux-x86_64
            cross: false

          # Linux aarch64 — static musl (Raspberry Pi, ARM servers)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: tg-proxy-linux-aarch64
            cross: true

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tg-proxy-windows-x86_64.exe
            cross: false

          # macOS Intel — cross-compiled from Apple Silicon runner (macos-13 was removed)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tg-proxy-macos-x86_64
            cross: false

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tg-proxy-macos-aarch64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install musl tools (Linux native)
        if: matrix.target == 'x86_64-unknown-linux-musl' && matrix.cross == false
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools

      - name: Build (native)
        if: matrix.cross == false
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/tg-proxy ${{ matrix.artifact }}

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target\${{ matrix.target }}\release\tg-proxy.exe" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    # Run even if some build jobs failed — publish whatever compiled successfully
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum tg-proxy-* | tee SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "tg-proxy ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ## tg-proxy ${{ github.event.inputs.tag || github.ref_name }}

            Telegram, where Telegram is blocked: one small binary, no server, no VPN.
            Tunnels Telegram over WebSocket — direct, with SNI fronting, through a free
            Cloudflare Worker, Cloudflare-proxied domains, or plain TCP — and tells you
            which routes work on your network.

            ### Download

            | Platform | File |
            |---|---|
            | Linux x86_64 (static) | `tg-proxy-linux-x86_64` |
            | Linux aarch64 (static) | `tg-proxy-linux-aarch64` |
            | Windows x86_64 | `tg-proxy-windows-x86_64.exe` |
            | macOS Intel | `tg-proxy-macos-x86_64` |
            | macOS Apple Silicon | `tg-proxy-macos-aarch64` |

            Verify with `SHA256SUMS.txt`.

            ### Quick start

            ```
            chmod +x tg-proxy-linux-x86_64 && ./tg-proxy-linux-x86_64     # Linux / macOS
            tg-proxy-windows-x86_64.exe                                   # Windows
            ```

            Click the `tg://proxy?…` link it prints to add the proxy to Telegram.
            Something wrong? Run `tg-proxy --check` to see which routes work.

            **Docs:** [English](https://github.com/AlexMelanFromRingo/tg-proxy#readme) ·
            [Русский](https://github.com/AlexMelanFromRingo/tg-proxy/blob/main/README.ru.md) ·
            [Cloudflare Worker guide](https://github.com/AlexMelanFromRingo/tg-proxy/blob/main/docs/CLOUDFLARE.md)

            macOS may block unsigned binaries on first run: right-click → Open, or
            `xattr -d com.apple.quarantine ./tg-proxy-macos-*`.
          files: |
            dist/tg-proxy-*
            dist/SHA256SUMS.txt
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
