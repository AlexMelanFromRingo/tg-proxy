[package]
name = "tg_proxy"
version = "0.1.0"
edition = "2021"
description = "Telegram WebSocket bridge proxy — high-performance SOCKS5 proxy that tunnels Telegram traffic over WebSocket"
license = "MIT"
repository = "https://github.com/young-developer/tg-proxy"

[[bin]]
name = "tg-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.22"
rand = "0.8"
thiserror = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
